name: Release plugin JAR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional exact release version, e.g. 3.0.0. Leave blank to auto-increment patch.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve semantic version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PROJECT_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          PROJECT_VERSION="${PROJECT_VERSION%-SNAPSHOT}"

          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: $INPUT_VERSION (expected X.Y.Z)" >&2
              exit 1
            fi
          else
            LAST_TAG="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -n "$LAST_TAG" ]]; then
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            elif [[ "$PROJECT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            elif [[ "$PROJECT_VERSION" =~ ^([0-9]+)\.([0-9]+) ]]; then
              VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
            elif [[ "$PROJECT_VERSION" =~ ^([0-9]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}.0.0"
            else
              echo "Cannot derive semantic version from Maven version: $PROJECT_VERSION" >&2
              exit 1
            fi
          fi

          TAG="v${VERSION}"
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          COMMIT_BODY="$(git log -1 --pretty=%b)"

          {
            echo "## Description"
            echo
            echo "${REPO_NAME} v${VERSION} includes the latest successfully built changes from the main branch."
            echo
            echo "### Latest change"
            echo
            echo "- ${COMMIT_SUBJECT}"
            if [[ -n "$COMMIT_BODY" ]]; then
              echo
              printf '%s\n' "$COMMIT_BODY"
            fi
          } > release-prefix.md

          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build plugin
        shell: bash
        run: |
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B -ntp clean package

      - name: Validate ItemsAdder content
        run: python3 tools/validate_itemsadder_content.py

      - name: Prepare release assets
        shell: bash
        run: |
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*.jar' \
            -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo 'No plugin JAR was produced.' >&2
            exit 1
          fi

          mkdir -p release
          PLUGIN_ASSET="release/${REPO_NAME}-${VERSION}.jar"
          ITEMSADDER_ASSET="release/${REPO_NAME}-ItemsAdder-${VERSION}.zip"
          cp "$JAR" "$PLUGIN_ASSET"
          (
            cd itemsadder-content
            zip -qr "../$ITEMSADDER_ASSET" mahjongcraft
          )
          echo "PLUGIN_ASSET=$PLUGIN_ASSET" >> "$GITHUB_ENV"
          echo "ITEMSADDER_ASSET=$ITEMSADDER_ASSET" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite history." >&2
            exit 1
          fi

          PREFIX_NOTES="$(cat release-prefix.md)"
          gh release create "$TAG" "$PLUGIN_ASSET" "$ITEMSADDER_ASSET" \
            --title "${REPO_NAME} v${VERSION}" \
            --notes "$PREFIX_NOTES" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --latest
