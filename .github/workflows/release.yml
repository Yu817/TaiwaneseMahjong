name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v2.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B clean package

      - name: Find JAR artifact
        id: artifact
        shell: bash
        run: |
          jar="$(find target -maxdepth 1 -type f -name 'TaiwaneseMahjong-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"

          if [[ -z "$jar" ]]; then
            echo 'No TaiwaneseMahjong JAR was produced in target/' >&2
            exit 1
          fi

          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          JAR_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          gh release create "$RELEASE_TAG" "$JAR_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TaiwaneseMahjong $RELEASE_VERSION" \
            --generate-notes
