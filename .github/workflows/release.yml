name: Release plugin JAR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve release metadata
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          COMMIT_BODY="$(git log -1 --pretty=%b)"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            TAG="latest"
            VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
            VERSION="${VERSION%-SNAPSHOT}"
          fi

          TITLE="Release ${VERSION} - ${COMMIT_SUBJECT}"

          {
            echo "## 更新內容"
            echo
            echo "- ${COMMIT_SUBJECT}"
            if [[ -n "$COMMIT_BODY" ]]; then
              echo
              printf '%s\n' "$COMMIT_BODY"
            fi
            echo
            echo "## 建置資訊"
            echo
            echo "- 版本：\`${VERSION}\`"
            echo "- Commit：\`${GITHUB_SHA}\`"
          } > release-notes.md

          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"

      - name: Build plugin
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          fi
          mvn -B -ntp clean package

      - name: Prepare release asset
        shell: bash
        run: |
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*.jar' \
            -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo 'No plugin JAR was produced.' >&2
            exit 1
          fi

          mkdir -p release
          ASSET_PATH="release/${REPO_NAME}-${VERSION}.jar"
          cp "$JAR" "$ASSET_PATH"
          echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$TAG" == "latest" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -f latest "$GITHUB_SHA"
            git push origin refs/tags/latest --force
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_PATH" --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG" "$ASSET_PATH" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
